<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <!-- Lets browsers that support it report the phone's text size through rem (Large Text, QA round 4 #15). -->
  <meta name="text-scale" content="scale" />
  <title>Side Hustle City: Gig Sim</title>
  <meta name="theme-color" content="#0E3261" />
  <meta name="description" content="Survive 30 days of odd jobs, rising stress, and weekly rent in a gig-work sim." />
  <link rel="canonical" href="https://side-hustle-city-gig-sim.vercel.app/" />
  <!-- Link previews (web pivot, 2026-10-11): the game is shared as a web link now. -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://side-hustle-city-gig-sim.vercel.app/" />
  <meta property="og:title" content="Side Hustle City: Gig Sim" />
  <meta property="og:description" content="Survive 30 days of odd jobs, rising stress and weekly rent. Free in your browser, no ads, no sign-up." />
  <meta property="og:image" content="https://side-hustle-city-gig-sim.vercel.app/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://side-hustle-city-gig-sim.vercel.app/og-image.jpg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/brand/favicon-48.png" type="image/png" />
  <link rel="preload" as="image" href="/brand/backdrop.webp" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
  <style>
    /* The game is a full-screen app, never a scrolling page (QA round 2 #1, #6, #16): nothing is
       ever below the fold, so there is nothing to scroll to, on a landscape phone, a desktop
       window, or inside an Android WebView. #game is pinned to the visible safe area with fixed
       positioning instead of 100vh, which on mobile browsers is the height BEHIND the toolbar. */
    html, body {
      margin: 0; padding: 0; background: #0b1530; height: 100%; width: 100%;
      overflow: hidden;
      overscroll-behavior: none; /* kill pull-to-refresh / rubber-band scroll during QTEs */
      touch-action: manipulation;
    }
    #game {
      position: fixed;
      top: env(safe-area-inset-top, 0px); right: env(safe-area-inset-right, 0px);
      bottom: env(safe-area-inset-bottom, 0px); left: env(safe-area-inset-left, 0px);
      display: flex; align-items: center; justify-content: center;
    }
    #game canvas { display: block; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    /* The bands beside (or above and below) the 4:3 game (publisher polish 2026-10-12). A still
       backdrop baked from the key art with its blur already applied (public/brand/backdrop.webp),
       a vignette, and a tint that fades to each phase's mood (src/main.js). Nothing blurs or
       repaints at runtime: the QA round 4 version copied the canvas into a CSS-blurred div five
       times a second and flickered on every screen change. Divs, so the page keeps one canvas. */
    #ambient, #ambient-tint { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    #ambient {
      background: radial-gradient(ellipse at center, rgba(11,21,48,0) 35%, rgba(11,21,48,.72) 100%),
                  url('/brand/backdrop.webp') center / cover no-repeat, #0b1530;
    }
    #ambient-tint { background-color: #0E3261; opacity: .22; transition: background-color 1s ease; will-change: opacity; }
    /* Opening splash: the key-art banner while the game boots (src/main.js removes it). */
    #splash {
      position: fixed; inset: 0; z-index: 1500; pointer-events: none;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
      background: radial-gradient(ellipse at center, rgba(11,21,48,.35) 30%, rgba(11,21,48,.92) 100%),
                  url('/brand/backdrop.webp') center / cover no-repeat, #0b1530;
      transition: opacity .45s ease;
    }
    #splash.gone { opacity: 0; }
    #splash img { width: min(92vw, 1100px, 150vh); height: auto; border-radius: 10px; box-shadow: 0 18px 60px rgba(0,0,0,.55); }
    @media (prefers-reduced-motion: reduce) { #ambient-tint, #splash { transition: none; } }
    #game { z-index: 1; }
    /* Portrait phones: the 4:3 game is small there. A hint in the empty band above the game, never
       over it and never blocking a tap (pointer-events: none). */
    #rotate-hint {
      display: none; position: fixed; left: 16px; right: 16px; top: calc(env(safe-area-inset-top, 0px) + 16px);
      pointer-events: none; text-align: center; font: 600 15px/1.35 system-ui, sans-serif;
      color: #f5deb3; background: rgba(60, 40, 22, 0.92); border: 1px solid #c9a876; border-radius: 12px; padding: 10px 14px;
    }
    @media (orientation: portrait) and (max-width: 600px) { #rotate-hint { display: block; } }
  </style>
</head>
<body>
  <div id="ambient" aria-hidden="true"></div>
  <div id="ambient-tint" aria-hidden="true"></div>
  <div id="splash" role="img" aria-label="Side Hustle City: Gig Sim, loading">
    <img src="/brand/banner-960.webp" srcset="/brand/banner-960.webp 960w, /brand/banner-1600.webp 1600w" sizes="min(92vw, 1100px)" alt="" width="960" height="469" decoding="async" fetchpriority="high" />
  </div>
  <div id="game"></div>
  <div id="rotate-hint" aria-hidden="true">&#x21bb; Turn your phone sideways for a bigger, easier view</div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
