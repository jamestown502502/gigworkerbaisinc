<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Side Hustle City: Gig Sim</title>
  <meta name="theme-color" content="#1d150d" />
  <meta name="description" content="Survive 30 days of odd jobs, rising stress, and weekly rent in a gig-work sim." />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
  <style>
    /* The game is a full-screen app, never a scrolling page (QA round 2 #1, #6, #16): nothing is
       ever below the fold, so there is nothing to scroll to, on a landscape phone, a desktop
       window, or inside an Android WebView. #game is pinned to the visible safe area with fixed
       positioning instead of 100vh, which on mobile browsers is the height BEHIND the toolbar. */
    html, body {
      margin: 0; padding: 0; background: #1d150d; height: 100%; width: 100%;
      overflow: hidden;
      overscroll-behavior: none; /* kill pull-to-refresh / rubber-band scroll during QTEs */
      touch-action: manipulation;
    }
    #game {
      position: fixed;
      top: env(safe-area-inset-top, 0px); right: env(safe-area-inset-right, 0px);
      bottom: env(safe-area-inset-bottom, 0px); left: env(safe-area-inset-left, 0px);
      display: flex; align-items: center; justify-content: center;
    }
    #game canvas { display: block; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    /* Portrait phones: the 4:3 game is small there. A hint in the empty band above the game, never
       over it and never blocking a tap (pointer-events: none). */
    #rotate-hint {
      display: none; position: fixed; left: 16px; right: 16px; top: calc(env(safe-area-inset-top, 0px) + 16px);
      pointer-events: none; text-align: center; font: 600 15px/1.35 system-ui, sans-serif;
      color: #f5deb3; background: rgba(60, 40, 22, 0.92); border: 1px solid #c9a876; border-radius: 12px; padding: 10px 14px;
    }
    @media (orientation: portrait) and (max-width: 600px) { #rotate-hint { display: block; } }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="rotate-hint" aria-hidden="true">&#x21bb; Turn your phone sideways for a bigger, easier view</div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
